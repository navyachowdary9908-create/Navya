<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Assistant</title>
    <meta name="description" content="A clean, professional AI chatbot assistant.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div class="chat-app">
        <!-- Header -->
        <header class="chat-header">
            <div class="brand">
                <div class="bot-avatar" aria-hidden="true"><i class="fas fa-robot"></i></div>
                <div class="brand-info">
                    <h1 class="brand-name">AI Assistant</h1>
                    <span class="status"><span class="status-dot"></span> Online</span>
                </div>
            </div>
            <div class="header-actions">
                <span class="model-badge" title="Current model"><i class="fas fa-microchip"></i> Gemini 3.6 Flash</span>
                <button id="resetBtn" class="icon-btn" title="Start a new chat" aria-label="Start a new chat">
                    <i class="fas fa-plus"></i>
                </button>
            </div>
        </header>

        <!-- Conversation -->
        <main id="chatMessages" class="chat-messages" aria-live="polite">
            <div id="welcome" class="welcome">
                <div class="welcome-avatar" aria-hidden="true"><i class="fas fa-robot"></i></div>
                <h2 class="welcome-title">How can I help you today?</h2>
                <p class="welcome-sub">Ask me anything — I can explain, write, analyze, and help you get things done.</p>
                <div class="suggestions">
                    <button class="chip" data-prompt="Summarize the key benefits of regular exercise">
                        <i class="fas fa-lightbulb"></i> Summarize benefits of exercise
                    </button>
                    <button class="chip" data-prompt="Write a professional email to reschedule a meeting">
                        <i class="fas fa-pen"></i> Draft a reschedule email
                    </button>
                    <button class="chip" data-prompt="Explain how the internet works in simple terms">
                        <i class="fas fa-globe"></i> Explain the internet
                    </button>
                </div>
            </div>
        </main>

        <!-- Typing Indicator -->
        <div id="typingIndicator" class="typing-indicator hidden" aria-label="Assistant is typing">
            <div class="message bot-message">
                <div class="message-avatar"><i class="fas fa-robot"></i></div>
                <div class="message-body">
                    <div class="message-content typing">
                        <div class="typing-dots"><span></span><span></span><span></span></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Composer -->
        <footer class="chat-composer">
            <div class="composer-box">
                <textarea id="userInput" rows="1" placeholder="Type your message…"
                    aria-label="Type your message"></textarea>
                <button id="sendBtn" class="send-btn" title="Send message (Enter)" aria-label="Send message">
                    <i class="fas fa-paper-plane"></i>
                </button>
            </div>
            <p class="composer-hint"><span class="hint-keys">Enter</span> to send &middot; <span class="hint-keys">Shift&nbsp;+&nbsp;Enter</span> for a new line</p>
        </footer>
    </div>

    <script src="/script.js"></script>
</body>
</html>
